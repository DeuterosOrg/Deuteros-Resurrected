name: CI

# Advisory only: this workflow is never a required status check.
# Direct pushes to develop are fine; a red build is a heads-up, not a block.

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 6.0.x
      - name: Compile C# (Godot.NET.Sdk from NuGet; no Godot binary needed)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: dotnet build Godot/Deuteros.csproj -nologo
