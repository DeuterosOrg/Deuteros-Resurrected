name: Discord Notifications

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, closed]

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - name: Commit pushed
        if: github.event_name == 'push'
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9 # 0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            📢 New commit pushed by ${{ github.actor }} on branch `${{ github.ref_name }}`:
            - ${{ github.event.head_commit.message }}
            🔗 ${{ github.event.head_commit.url }}
      - name: Pull request
        if: github.event_name == 'pull_request'
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9 # 0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🔀 PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.merged && 'merged' || github.event.action }} by ${{ github.actor }}: ${{ github.event.pull_request.title }}
            🔗 ${{ github.event.pull_request.html_url }}
