name: PR title

# pull_request_target so it also works on PRs from forks. Safe: this job never
# checks out or runs PR code. It only reads the title from the event payload.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            revert
            docs
            test
            ci
            build
            chore
          requireScope: false
